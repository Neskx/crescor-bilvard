# Deploys the backend to the Supabase project on every push to main that
# changes anything under supabase/: applies new migrations, then deploys all
# Edge Functions. Already-applied migrations are skipped.
#
# Required repository secret:   SUPABASE_ACCESS_TOKEN  (Account → Access Tokens)
# Required repository variable: SUPABASE_PROJECT_REF
#
# Edge Function secrets (RESEND_API_KEY, …) are NOT managed here; set them once
# with `supabase secrets set`.

name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: supabase

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply migrations
        run: supabase db push --yes

      - name: Deploy Edge Functions
        run: supabase functions deploy --use-api --project-ref "$PROJECT_REF"
