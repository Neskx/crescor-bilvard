<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Crescor Bilvård – Professionell biltvätt och bilvård</title>
    <meta
      name="description"
      content="Crescor Bilvård erbjuder professionell biltvätt med valbara tillägg som keramiskt sprayvax, fläckborttagning, luktbehandling och vattenavvisande vindruta. Boka din tid enkelt online."
    />
    <meta name="theme-color" content="#080808" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:site_name" content="Crescor Bilvård" />
    <meta property="og:title" content="Crescor Bilvård – Precision i varje detalj" />
    <meta
      property="og:description"
      content="Professionell bilvård för dig som vill ge din bil den uppmärksamhet den förtjänar. Boka enkelt online."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Hero image is the LCP element: start fetching it immediately -->
    <link rel="preload" as="image" href="/images/hero-mobile.webp" media="(max-width: 767px)" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/hero-desktop.webp" media="(min-width: 768px)" type="image/webp" fetchpriority="high" />

    <!-- Structured data. Address/phone are added at runtime from the database once configured. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoWash",
        "@id": "%VITE_SITE_URL%/#business",
        "name": "Crescor Bilvård",
        "url": "%VITE_SITE_URL%/",
        "image": "%VITE_SITE_URL%/og-image.jpg",
        "logo": "%VITE_SITE_URL%/logo/crescor-logo.png",
        "description": "Professionell biltvätt med valbara tillägg: djurhår, keramiskt sprayvax, fläckborttagning, vattenavvisande vindruta och luktbehandling.",
        "inLanguage": "sv-SE"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:24px;font-family:sans-serif;color:#fff;background:#080808">
        Crescor Bilvård – aktivera JavaScript för att se webbplatsen och boka tid.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
